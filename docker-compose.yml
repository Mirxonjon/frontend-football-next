# Production-style compose for the Next.js frontend.
#
# Port is taken from the host environment via ${APP_PORT}. If you don't set
# it, it falls back to 3001. Override per-host like:
#   APP_PORT=8080 docker compose up -d --build
# or via an `.env` file next to this compose file.
#
# NEXT_PUBLIC_* values must be present at BUILD time (Next inlines them into
# the client bundle). Compose passes them through to the Dockerfile via the
# `args:` block so a single `.env` is the source of truth.

services:
  web:
    container_name: coachingzona-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_ORIGIN: ${NEXT_PUBLIC_APP_ORIGIN}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CORS_ORIGINS: ${NEXT_PUBLIC_CORS_ORIGINS}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_YT_API_KEY: ${NEXT_PUBLIC_YT_API_KEY}
    image: coachingzona-web:latest
    restart: unless-stopped
    environment:
      # Next's standalone server reads PORT + HOSTNAME at runtime.
      PORT: ${APP_PORT:-3001}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      # Host port comes from env; container port matches PORT.
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:'+process.env.PORT+'/',
          r => process.exit(r.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
